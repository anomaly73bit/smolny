name: Screenshot sito

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fotografa le pagine
        run: |
          npm i -g playwright@1.47.2 >/dev/null
          npx playwright@1.47.2 install --with-deps chromium >/dev/null
          mkdir -p shots
          B=https://anomaly73bit.github.io/smolny
          npx playwright@1.47.2 screenshot --wait-for-timeout 3500 --viewport-size "1440,1000" "$B/" shots/home-desktop.png
          npx playwright@1.47.2 screenshot --wait-for-timeout 3500 --viewport-size "1440,1000" --full-page "$B/en/" shots/home-en-full.png
          npx playwright@1.47.2 screenshot --wait-for-timeout 3500 --device "iPhone 13" "$B/" shots/home-mobile.png
          npx playwright@1.47.2 screenshot --wait-for-timeout 2500 --viewport-size "1440,1000" "$B/fonti/" shots/fonti.png
          npx playwright@1.47.2 screenshot --wait-for-timeout 2500 --viewport-size "1440,1000" "$B/paesi/" shots/paesi.png
      - name: Salva sul branch screenshots
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "smolny-robot"
          git config user.email "smolny-robot@users.noreply.github.com"
          git add . && git commit -qm "Screenshot $(date -u +'%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
