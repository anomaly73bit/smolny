name: Screenshot sito

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Fotografa le pagine
        run: |
          mkdir -p shots
          B=https://anomaly73bit.github.io/smolny
          CH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "browser: $CH" | tee shots/log.txt
          shot() {  # nome, larghezza, altezza, url
            "$CH" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=6000 --window-size="$2,$3" \
              --screenshot="shots/$1.png" "$4" >>shots/log.txt 2>&1 || echo "errore $1" >>shots/log.txt
          }
          shot home-desktop 1440 1000 "$B/"
          shot home-desktop-long 1440 2600 "$B/"
          shot home-en 1440 1000 "$B/en/"
          shot home-mobile 390 1700 "$B/"
          shot fonti 1440 1300 "$B/fonti/"
          shot paesi 1440 1300 "$B/paesi/"
          ls -la shots | tee -a shots/log.txt
      - name: Salva sul branch screenshots
        if: always()
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "smolny-robot"
          git config user.email "smolny-robot@users.noreply.github.com"
          git add . && git commit -qm "Screenshot $(date -u +'%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
